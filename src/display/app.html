<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPRE</title>
<style>
:root {
    --paper: #eef0f4;
    --card: #ffffff;
    --ink: #1d2230;
    --muted: #6b7286;
    --hair: rgba(29, 34, 48, 0.08);
    --shell: rgba(29, 34, 48, 0.05);
    --accent: #007aff;
    color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
    :root {
        --paper: #16181e;
        --card: #1f222a;
        --ink: #e9ebf1;
        --muted: #9097a8;
        --hair: rgba(233, 235, 241, 0.08);
        --shell: rgba(233, 235, 241, 0.05);
        --accent: #0a84ff;
    }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink); font: 400 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", "Noto Sans", sans-serif; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-areas: "head head" "stage panel" "hint panel"; gap: 18px 22px; width: min(1440px, 100% - 32px); margin: 0 auto; padding: 28px 0 40px; align-items: start; }
header { grid-area: head; }
.player { grid-area: stage; display: grid; gap: 8px; min-width: 0; }
.fps { min-height: 18px; padding: 0 8px; }
.hint { grid-area: hint; }
.dock { grid-area: panel; height: min(760px, calc(100dvh - 120px)); position: sticky; top: 20px; }
@media (max-width: 980px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "stage" "panel" "hint"; }
    .dock { position: static; height: 560px; }
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-size: clamp(20px, 3vw, 28px); font-weight: 650; letter-spacing: -0.015em; }
.connection { color: var(--muted); font-size: 13px; }
.bezel { position: relative; width: 100%; padding: 6px; border-radius: 22px; background: var(--shell); outline: 1px solid var(--hair); outline-offset: -1px; box-shadow: 0 40px 80px -48px rgba(29, 34, 48, 0.45); }
.bezel canvas { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1px var(--hair); touch-action: none; }
.hint { margin: 0; color: var(--muted); font-size: 13px; max-width: 64ch; }
kbd { font: inherit; padding: 1px 6px; border-radius: 6px; background: var(--card); box-shadow: inset 0 0 0 1px var(--hair); }
@media (max-width: 760px) { main { padding-top: 16px; } }
</style>
</head>
<body>
<main>
    <header>
        <h1 data-title>SPRE</h1>
        <span class="connection" data-connection>Starting</span>
    </header>
    <section class="player">
        <div class="fps" data-fps></div>
        <div class="bezel"><canvas data-stage width="480" height="360" tabindex="0" aria-label="Stage"></canvas></div>
    </section>
    <div class="dock" data-panel></div>
    <p class="hint">Keys and the mouse go to the project. Everything you do is recorded, so you can drag the timeline back to any earlier frame. <kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>S</kbd> shows or hides the panel.</p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
